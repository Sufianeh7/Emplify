<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi Cuadrante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-datetime
    presentation="date"
    [highlightedDates]="diasDestacados"
    (ionChange)="diaSeleccionado($event)"
    size="cover">
  </ion-datetime>

  <ion-card class="ion-margin-top" *ngIf="turnoElegido">
    <ion-card-header>
      <ion-card-subtitle>Detalle del día</ion-card-subtitle>
      <ion-card-title>{{ fechaElegidaNormal }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h3>Turno: <strong>{{ turnoElegido?.tipo }}</strong></h3>

      <p *ngIf="turnoElegido?.tipo === 'MAÑANA'" style="font-size: 1.1em; margin-top: 10px;">
        <ion-icon name="time-outline" style="vertical-align: middle;"></ion-icon>
        Horario: <strong>08:00 - 16:00</strong>
      </p>

      <p *ngIf="turnoElegido?.tipo === 'TARDE'" style="font-size: 1.1em; margin-top: 10px;">
        <ion-icon name="time-outline" style="vertical-align: middle;"></ion-icon>
        Horario: <strong>16:00 - 00:00</strong>
      </p>

      <p *ngIf="turnoElegido?.tipo === 'NOCHE'" style="font-size: 1.1em; margin-top: 10px;">
        <ion-icon name="time-outline" style="vertical-align: middle;"></ion-icon>
        Horario: <strong>00:00 - 08:00</strong>
      </p>

      <p *ngIf="turnoElegido?.tipo === 'LIBRE' || turnoElegido?.tipo === 'VACACIONES'" style="color: gray; margin-top: 10px;">
        <ion-icon name="happy-outline" style="vertical-align: middle;"></ion-icon>
        ¡Día libre! No hay horario asignado.
      </p>
    </ion-card-content>
  </ion-card>

  <ion-list inset="true" class="ion-margin-top">
    <ion-list-header>
      <ion-label>Leyenda de Turnos</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-icon name="ellipse" style="color: #2dd36f;" slot="start"></ion-icon>
      <ion-label>Mañana</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="ellipse" style="color: #ffc409;" slot="start"></ion-icon>
      <ion-label>Tarde</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="ellipse" style="color: #5260ff;" slot="start"></ion-icon>
      <ion-label>Noche</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="ellipse" style="color: #92949c;" slot="start"></ion-icon>
      <ion-label>Libre</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
