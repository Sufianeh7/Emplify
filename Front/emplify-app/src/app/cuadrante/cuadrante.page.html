<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi Cuadrante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-datetime
    presentation="date"
    [highlightedDates]="diasDestacados"
    (ionChange)="diaSeleccionado($event)"
    size="cover">
  </ion-datetime>

  <ion-card class="ion-margin-top" *ngIf="turnoElegido">

    <ion-card-header>
      <ion-card-subtitle>Detalle del día</ion-card-subtitle>
      <ion-card-title>{{ fechaElegidaNormal }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h3>Turno: <strong>{{ turnoElegido?.turno }}</strong></h3>

      <p *ngIf="turnoElegido?.horaInicio" style="font-size: 1.1em; margin-top: 10px;">
        <ion-icon name="time-outline" style="vertical-align: middle;"></ion-icon>
        Horario: <strong>{{ turnoElegido?.horaInicio }} - {{ turnoElegido?.horaFin }}</strong>
      </p>

      <p *ngIf="!turnoElegido?.horaInicio" style="color: gray; margin-top: 10px;">
        <ion-icon name="happy-outline" style="vertical-align: middle;"></ion-icon>
        No hay horario asignado para este día.
      </p>
    </ion-card-content>

  </ion-card>

</ion-content>
