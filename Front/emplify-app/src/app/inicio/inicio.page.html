<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Portal Emplify</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div style="text-align: center; margin-top: 30px; margin-bottom: 30px;">
    <h2>¡Bienvenido/a, {{nombreUsuario}}!</h2>
    <p>Has iniciado sesión correctamente en <strong>{{nombreEmpresa}}</strong>.</p>
  </div>

  <ion-list>
    <ion-item button detail="true" (click)="goCuadrante()">
      <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Mi Cuadrante / Turnos</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goSolicitudes()">
      <ion-icon name="airplane-outline" slot="start" color="secondary"></ion-icon>
      <ion-label>Solicitar días libres</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goVozEmpleado()">
      <ion-icon name="megaphone-outline" slot="start" color="tertiary"></ion-icon>
      <ion-label>Voz del Empleado</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goTickets()">
      <ion-icon name="ticket-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Mis Consultas (RRHH)</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goEquipo()" *ngIf="esManager">
      <ion-icon name="people-outline" slot="start" color="success"></ion-icon>
      <ion-label>Mi Equipo (Peticiones)</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goGestionRRHH()" *ngIf="esRRHH">
      <ion-icon name="briefcase-outline" slot="start" color="tertiary"></ion-icon>
      <ion-label>Gestión de Tickets (RRHH)</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="goPerfil()">
      <ion-icon name="person-circle-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Mi Perfil</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
