<div *ngIf="ticketSeleccionado" class="chat-container">
    <ion-toolbar color="white">
      <ion-buttons slot="start">
        <ion-button (click)="ticketSeleccionado = null">
          <ion-icon name="close"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>{{ ticketSeleccionado.titulo }}</ion-title>
    </ion-toolbar>

    <div class="messages-list">

      <div class="message in">
        <div class="bubble">
          <small>{{ ticketSeleccionado.empleado?.usuario?.nombre }}</small>
          <p>{{ ticketSeleccionado.descripcion }}</p>
        </div>
      </div>

      <div *ngFor="let msg of ticketSeleccionado.mensajes"
           class="message"
           [ngClass]="{'out': msg.autor?.idEmpleado !== ticketSeleccionado.empleado?.idEmpleado,
                       'in': msg.autor?.idEmpleado === ticketSeleccionado.empleado?.idEmpleado}">

        <div class="bubble">
          <small *ngIf="msg.autor?.idEmpleado === ticketSeleccionado.empleado?.idEmpleado">
            {{ msg.autor?.usuario?.nombre }}
          </small>

          <p>{{ msg.contenido }}</p>
          <span class="time">{{ msg.fechaEnvio | date:'HH:mm' }}</span>
        </div>
      </div>

    </div>

    <ion-footer class="ion-no-border" *ngIf="ticketSeleccionado.estado !== 'RESUELTO'">
      <ion-item lines="none" class="input-item">
        <ion-textarea [(ngModel)]="nuevoMensaje" placeholder="Escribe a RRHH..." auto-grow="true" rows="1"></ion-textarea>
        <ion-button fill="clear" (click)="enviarRespuesta()">
          <ion-icon name="send" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
      <ion-button expand="block" color="success" (click)="resolverTicket(ticketSeleccionado.idTicket)" class="ion-margin">
        Cerrar Ticket como Resuelto
      </ion-button>
    </ion-footer>
  </div>
