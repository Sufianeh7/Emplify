<ion-header class="ion-no-border">
  <app-header></app-header>
</ion-header>

<ion-content class="app-background">

  <div class="dashboard-container">

    <div class="flat-card profile-link-card ion-activatable ripple-parent" (click)="goTo('/perfil')">
      <div class="profile-info-wrapper">
        <div class="avatar-mini">
          <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Avatar" />
        </div>
        <div class="profile-text">
          <h2>{{ empleado?.usuario?.nombre || 'Usuario' }}</h2>
          <p>{{ empleado?.puesto || 'Ver mi perfil y detalles' }}</p>
          <p class="correo">{{ empleado?.usuario?.email }}</p>
        </div>
      </div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
      <ion-ripple-effect></ion-ripple-effect>
    </div>

    <div class="menu-card">

      <div class="menu-item ion-activatable ripple-parent" (click)="goToAusencias()">
        <ion-icon name="airplane-outline" class="item-icon" style="color: #0071ad;"></ion-icon>
        <span>Tiempo libre y permisos</span>
        <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </div>

      <div class="menu-item ion-activatable ripple-parent" (click)="goTo('/voz-empleado')">
        <ion-icon name="megaphone-outline" class="item-icon" style="color: #e67e22;"></ion-icon>
        <span>Voz del Empleado</span>
        <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </div>

      <div class="menu-item ion-activatable ripple-parent" (click)="goTo('/tickets')">
        <ion-icon name="chatbubbles-outline" class="item-icon" style="color: #27ae60;"></ion-icon>
        <span>Ayuda y asistencia (Tickets)</span>
        <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        <ion-ripple-effect></ion-ripple-effect>
      </div>

    </div>

    <ng-container *ngIf="esRRHH || esManager || esAdmin">
      <h3 class="section-title">Herramientas de Gestión</h3>

      <div class="menu-card admin-card">

        <div class="menu-item ion-activatable ripple-parent" *ngIf="esRRHH || esAdmin" (click)="goTo('/gestion-rrhh')">
          <ion-icon name="people-outline" class="item-icon"></ion-icon>
          <span>Gestión de Empleados</span>
          <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
          <ion-ripple-effect></ion-ripple-effect>
        </div>

        <div class="menu-item ion-activatable ripple-parent" *ngIf="esManager || esRRHH || esAdmin" (click)="goTo('/cuadrantes')">
          <ion-icon name="calendar-outline" class="item-icon"></ion-icon>
          <span>Gestión de Cuadrantes</span>
          <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
          <ion-ripple-effect></ion-ripple-effect>
        </div>

        <div class="menu-item ion-activatable ripple-parent" *ngIf="esAdmin" (click)="goTo('/admin')">
          <ion-icon name="shield-checkmark-outline" class="item-icon"></ion-icon>
          <span>Panel de Administración</span>
          <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
          <ion-ripple-effect></ion-ripple-effect>
        </div>

      </div>
    </ng-container>

  </div>

</ion-content>
