<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Voz del Empleado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="publicaciones.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="chatbubbles-outline" style="font-size: 64px; color: gray;"></ion-icon>
    <p>Aún no hay publicaciones en tu empresa.</p>
  </div>

  <ion-card *ngFor="let pub of publicaciones">
    <ion-item lines="none">
      <ion-avatar slot="start">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ion-avatar>
      <ion-label>
        <h2>{{ pub.empleado?.usuario?.nombre }}</h2>
        <p>{{ pub.fechaCreacion | date:'short' }}</p>
      </ion-label>
    </ion-item>

    <ion-card-header>
      <ion-card-title>{{ pub.titulo }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      {{ pub.contenido }}
    </ion-card-content>

    <ion-item lines="none">
      <ion-button fill="clear" slot="start">
        <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
        Comentar
      </ion-button>
    </ion-item>
  </ion-card>

<ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="tertiary" id="open-modal">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-modal trigger="open-modal" #modal>
    <ng-template>
      <ion-header>
        <ion-toolbar color="tertiary">
          <ion-buttons slot="start">
            <ion-button (click)="modal.dismiss()">Cancelar</ion-button>
          </ion-buttons>
          <ion-title>Nueva Publicación</ion-title>
          <ion-buttons slot="end">
            <ion-button [disabled]="!nuevoTitulo || !nuevoContenido" (click)="publicar(modal)">
              Publicar
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-item fill="outline" class="ion-margin-bottom">
          <ion-label position="floating">Título del mensaje</ion-label>
          <ion-input [(ngModel)]="nuevoTitulo" placeholder="Ej: Sugerencia comedor"></ion-input>
        </ion-item>

        <ion-item fill="outline">
          <ion-label position="floating">¿Qué quieres decir?</ion-label>
          <ion-textarea [(ngModel)]="nuevoContenido" [autoGrow]="true" rows="6"></ion-textarea>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
