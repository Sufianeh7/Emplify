spring.application.name=emplify-backend

# --- CONFIGURACIÓN DE RUTAS ---
# Esto añade el prefijo /api a todos tus controladores (Arregla el Error 404)
server.servlet.context-path=/api

# --- CONFIGURACIÓN DE BASE DE DATOS ---
# Usamos variables de entorno para Render, y valores por defecto para tu PC (localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/emplify_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- CONFIGURACIÓN JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Esto ayuda a Hibernate a hablar mejor con MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SERIALIZACIÓN ---
# Evita fallos si Jackson encuentra objetos vacíos
spring.jackson.serialization.fail-on-empty-beans=false